<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廣東話文字轉語音並下載 MP3</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.download-btn {
            background-color: #2ecc71;
        }
        button.download-btn:hover {
            background-color: #27ae60;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>廣東話文字轉語音 & 下載 MP3 🎵</h1>
        <textarea id="textInput" placeholder="請在此輸入要轉換的廣東話文字...">你好！歡迎使用廣東話文字轉語音同埋下載 MP3 嘅網頁工具。</textarea>
        
        <div class="btn-group">
            <button id="generateBtn" onclick="generateSpeech()">生成語音</button>
            <button id="downloadBtn" class="download-btn" onclick="downloadMp3()" disabled>下載 MP3</button>
        </div>

        <div id="status"></div>
        <audio id="audioPlayer" controls style="display:none;"></audio>
    </div>

    <script>
        let audioBlob = null;
        let audioUrl = null;

        async function generateSpeech() {
            let text = document.getElementById('textInput').value.trim();
            let statusDiv = document.getElementById('status');
            let generateBtn = document.getElementById('generateBtn');
            let downloadBtn = document.getElementById('downloadBtn');
            let audioPlayer = document.getElementById('audioPlayer');

            if (!text) {
                alert('請先輸入文字！');
                return;
            }

            statusDiv.innerText = '正在轉為廣東話語音，請稍候...';
            generateBtn.disabled = true;
            downloadBtn.disabled = true;
            audioPlayer.style.display = 'none';

            try {
                // 使用 Google TTS 官方公開介面（透過轉譯將文字轉成語音流）
                // lang=zh-yue 代表廣東話
                let encodedText = encodeURIComponent(text);
                let ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=zh-yue&client=tw-ob`;

                // 為了避開瀏覽器的 CORS 限制，透過公開的 CORS 代理來抓取音訊二進位資料
                let proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(ttsUrl)}`;
                
                let response = await fetch(proxyUrl);
                if (!response.ok) {
                    throw new Error('網絡請求失敗，請稍後再試。');
                }

                audioBlob = await response.blob();
                audioUrl = URL.createObjectURL(audioBlob);

                // 設定播放器
                audioPlayer.src = audioUrl;
                audioPlayer.style.display = 'block';
                
                statusDiv.innerText = '生成成功！你可以點擊播放試聽，或按「下載 MP3」。';
                downloadBtn.disabled = false;
            } catch (error) {
                console.error(error);
                statusDiv.innerText = '生成失敗，可能文字過長或網絡受阻。';
            } finally {
                generateBtn.disabled = false;
            }
        }

        function downloadMp3() {
            if (!audioBlob) return;

            let a = document.createElement('a');
            a.href = audioUrl;
            a.download = 'cantonese_speech.mp3';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
